name: OGM CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt xlwt==1.3.0
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile server.py operations.py maintenance.py writeoff.py fuel.py
